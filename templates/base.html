<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rapid Viable Product -- GIABO Digital PMO{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}GIABO Digital PMO Swarm by Rapid Viable Product -- six autonomous agents, one governed outcome.{% endblock %}">
  <link rel="icon" type="image/png" href="/static/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="mesh-bg" aria-hidden="true">
    <div class="mesh-blob mesh-blob-1"></div>
    <div class="mesh-blob mesh-blob-2"></div>
    <div class="mesh-blob mesh-blob-3"></div>
    <div class="mesh-glass"></div>
  </div>
  <div class="site-wrap">
    <nav class="site-nav">
      <div class="container">
        <a class="brand" href="/">
          <img src="/static/images/logo.png" alt="RVP Logo" class="rvp-logo">
          <span class="brand-name">
            Rapid Viable Product
            <small>GIABO Digital PMO Swarm</small>
          </span>
        </a>
        <div class="nav-links">
          <a href="/guide">Agent Handbook</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="copyright">&copy; {{ now_year() }} Rapid Viable Product LTD. All rights reserved.</div>
        <div class="footer-links">
          <a href="/guide">Agent Handbook</a>
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
